<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الحضور بالـ QR</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f7fb;color:#222}
    .wrap{max-width:620px;margin:30px auto;padding:18px}
    .card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    h1{margin-top:0;font-size:26px}
    .sub{color:#666;margin-bottom:20px}
    #reader{width:100%;max-width:480px;margin:18px auto;display:none}
    .result{padding:14px;border-radius:12px;background:#eef6ff;margin-top:15px;display:none}
    .success{background:#eaf8ee;color:#176b32}
    .error{background:#fff0f0;color:#a51d2d}
    input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:17px;margin:8px 0}
    button{border:0;border-radius:10px;padding:13px 18px;font-size:16px;cursor:pointer;background:#198754;color:white;margin-top:8px}
    button.secondary{background:#6c757d}
    button.danger{background:#dc3545}
    button:disabled{opacity:.6;cursor:not-allowed}
    .manual{margin-top:25px;padding-top:20px;border-top:1px solid #eee}
  </style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <h1>📷 تسجيل الحضور</h1>
    <div class="sub">اضغط على الزر لفتح الكاميرا وتصوير QR الخاص بالعضو.</div>

    <button id="startQrButton" onclick="startQr()">📷 تصوير QR</button>
    <button id="stopQrButton" class="danger" onclick="stopQr()" style="display:none">✖ إغلاق الكاميرا</button>

    <div id="reader"></div>
    <div id="result" class="result"></div>

    <div class="manual">
      <h3>تسجيل يدوي</h3>
      <small>اكتب Member ID مثل: M0001</small>
      <input id="manualMemberId" placeholder="M0001">
      <button onclick="submitManual()">✅ تسجيل الحضور</button>
    </div>
  </div>
</div>

<script>
/*
  ضع هنا رابط Web App الحالي لنظام Google Apps Script.
  لا نستخدم Google Sheet جديد.
*/
const SYSTEM_URL = "https://script.google.com/macros/s/AKfycbyWtXY3QZjsc-M9lOVqEhx8xm0PODnS7ZUsJCL9bxrBDjMTk8Njy3BKUn4inlbyTJifng/exec";

const ATTENDANCE_PAGE = "?page=attendance";
const MEMBER_PARAM = "memberId";

let qrScanner = null;
let locked = false;
let lastScanned = "";

function showResult(message, type="") {
  const box = document.getElementById("result");
  box.className = "result " + type;
  box.innerHTML = message;
  box.style.display = "block";
}

function startQr() {
  if (typeof Html5Qrcode === "undefined") {
    showResult("❌ لم يتم تحميل قارئ QR. تأكد من وجود إنترنت.", "error");
    return;
  }

  if (SYSTEM_URL.includes("PUT_YOUR_EXISTING")) {
    showResult("⚠️ الصفحة جاهزة، لكن لازم نربطها برابط نظام Apps Script الحالي أولًا.", "error");
    return;
  }

  if (qrScanner) return;

  const reader = document.getElementById("reader");
  const startButton = document.getElementById("startQrButton");
  const stopButton = document.getElementById("stopQrButton");

  reader.style.display = "block";
  startButton.style.display = "none";
  stopButton.style.display = "inline-block";

  qrScanner = new Html5Qrcode("reader");

  qrScanner.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: { width: 250, height: 250 }
    },
    function(decodedText) {
      const memberId = String(decodedText || "").trim();

      if (!memberId || locked || memberId === lastScanned) return;

      locked = true;
      lastScanned = memberId;

      showResult(
        "✅ تم قراءة QR<br>Member ID: <b>" +
        escapeHtml(memberId) +
        "</b><br>جاري تسجيل الحضور...",
        "success"
      );

      stopQr().then(function() {
        submitMember(memberId);
      });
    },
    function() {
      // أخطاء البحث العادية لا نعرضها.
    }
  ).catch(function(error) {
    qrScanner = null;
    reader.style.display = "none";
    startButton.style.display = "inline-block";
    stopButton.style.display = "none";

    showResult(
      "❌ تعذر تشغيل الكاميرا.<br>" +
      "اسمح للمتصفح باستخدام الكاميرا وتأكد أن الصفحة تعمل عبر HTTPS.",
      "error"
    );
  });
}

function stopQr() {
  return new Promise(function(resolve) {
    const reader = document.getElementById("reader");
    const startButton = document.getElementById("startQrButton");
    const stopButton = document.getElementById("stopQrButton");

    if (!qrScanner) {
      reader.style.display = "none";
      startButton.style.display = "inline-block";
      stopButton.style.display = "none";
      resolve();
      return;
    }

    const scanner = qrScanner;
    qrScanner = null;

    scanner.stop().then(function() {
      try { scanner.clear(); } catch(e) {}
      reader.style.display = "none";
      startButton.style.display = "inline-block";
      stopButton.style.display = "none";
      resolve();
    }).catch(function() {
      reader.style.display = "none";
      startButton.style.display = "inline-block";
      stopButton.style.display = "none";
      resolve();
    });
  });
}

function submitManual() {
  if (locked) return;

  const id = document.getElementById("manualMemberId").value.trim();

  if (!id) {
    showResult("⚠️ من فضلك اكتب Member ID.", "error");
    return;
  }

  locked = true;
  submitMember(id);
}

function submitMember(memberId) {
  memberId = String(memberId || "").trim();

  const target =
    SYSTEM_URL.replace(/\/$/, "") +
    ATTENDANCE_PAGE +
    "&" +
    encodeURIComponent(MEMBER_PARAM) +
    "=" +
    encodeURIComponent(memberId);

  setTimeout(function() {
    window.location.href = target;
  }, 500);
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, function(c) {
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c];
  });
}
</script>
</body>
</html>
